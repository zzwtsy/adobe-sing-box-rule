name: "Build RuleSet"

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

jobs:
  update-rule-set:
    name: "Update sing-box rule-set"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: "Checkout"
        uses: actions/checkout@v6
      - name: "Setup sing-box"
        env:
          SING_BOX_DEB_URL: "https://github.com/SagerNet/sing-box/releases/download/v1.12.12/sing-box_1.12.12_linux_amd64.deb"
        run: |
            set -Eeuo pipefail
            wget -O sing-box.deb $SING_BOX_DEB_URL
            sudo dpkg -i sing-box.deb
            rm sing-box.deb

      - name: "Compile rule-set"
        run: |
            wget https://raw.githubusercontent.com/ignaciocastro/a-dove-is-dumb/refs/heads/main/pihole.txt
            sing-box rule-set convert --type adguard --output adobe-block.srs pihole.txt
            sed -i '/^[^#]/s/^\(.*\)$/||\1^/' pihole.txt
            rm -rf adobe.srs pihole.txt*

      - name: "Commit and push"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
            set -Eeuo pipefail
            rm -rf .git
            git config --global init.defaultBranch main
            git init
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add .
            git commit --allow-empty-message --no-edit
            git remote add origin https://github-action:$GITHUB_TOKEN@github.com/zzwtsy/adobe-sing-box-rule.git
            git push origin main --force

      - name: "Delete old workflow runs"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          # 保留最近 3 条 completed 记录，删除更早的
          gh run list \
            --limit 100 \
            --status completed \
            --json databaseId,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[3:] | .[].databaseId' |
          while read -r run_id; do
            echo "Deleting workflow run: $run_id"
            gh run delete "$run_id" || true
          done
